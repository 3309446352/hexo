name: Sync Docs

on:
  push:
    branches:
      - Test
  schedule:
    - cron: '0 16 * * *'   # ✅ 北京时间 00:00
  workflow_dispatch:
  repository_dispatch:
    types:
      - deploy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检查分支
        uses: actions/checkout@master
        with:
          ref: Test

      - name: 安装 Node 环境
        uses: actions/setup-node@master
        with:
          node-version: "20.x"
          cache: 'npm'

      - name: 安装依赖
        run: |
          export TZ='Asia/Shanghai'
          export HUSKY=0
          npm install --prod --ignore-scripts

      - name: 拉取文档
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          IMAGES_TOKEN: ${{ secrets.IMAGES_TOKEN }}
          IMAGES_USER: ${{ secrets.IMAGES_USER }}
          IMAGES_REPO: ${{ secrets.IMAGES_REPO }}
        run: npm run sync

      - name: 执行删除脚本
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node clear.js

      - name: 配置 Git
        run: |
          git config --global user.name "3309446352"
          git config --global user.email "xuechengdugu@gmail.com"

      - name: 提交变更
        run: |
          git add .
          git commit -m "刷新文档和缓存" -a || echo "No changes"

      - name: 推送文档到仓库
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: Test

      - name: 任务失败告警
        if: failure()
        run: |
          echo "⚠️ 同步任务执行失败！"
          echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 调试信息
        run: |
          echo "事件类型: ${{ github.event_name }}"
          echo "触发者: ${{ github.actor }}"
          echo "仓库: ${{ github.repository }}"
          echo "分支: ${{ github.ref }}"
