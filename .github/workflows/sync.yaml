name: Sync Docs

on:
  # 允许手动push触发
  push:
    branches:
      - Test
  # 允许外部仓库事件触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时检查一次 (UTC时间)
  # 允许在GitHub界面上手动触发工作流
  workflow_dispatch:  # 允许手动触发
  # 允许通过API调用（如Vercel Serverless）触发
  repository_dispatch:
    types:
      - deploy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检查分支
        uses: actions/checkout@master
        with:
          ref: Test  # 明确指定分支

      - name: 安装node环境
        uses: actions/setup-node@master
        with:
          node-version: "20.x"  # 更新到更现代的Node.js版本
          cache: 'npm'  # 启用npm缓存加速安装

      - name: 安装依赖
        run: |
          export TZ='Asia/Shanghai'
          export HUSKY=0
          npm install --prod --ignore-scripts
      - name: Install Dependencies
        run: |
          npm install -g hexo-cli
          npm install
          npm install @notionhq/client
          npm install mkdirp

      # 步骤4：同步Notion（已注释，sync.js 不在仓库中，若需启用请先把 sync.js 提交到仓库根目录）
      # - name: Sync from Notion
      #   run: node sync.js
      #   env:
      #     NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      #     NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # 步骤5：拉取文档（elog 从 Notion 同步到 source/_posts）
      - name: 拉取文档
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          IMAGES_TOKEN: ${{ secrets.IMAGES_TOKEN }}
          IMAGES_USER: ${{ secrets.IMAGES_USER }}
          IMAGES_REPO: ${{ secrets.IMAGES_REPO }}
          IMAGES_BRANCH: ${{ secrets.IMAGES_BRANCH }}
        run: |
          npm run sync
      - name: 配置Git用户名邮箱
        run: |
          git config --global user.name "3309446352"
          git config --global user.email "xuechengdugu@gmail.com"

      # 步骤6：推送markdown回仓库 Test 分支
      - name: 推送文档到仓库
        run: |
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "sync: auto update from notion [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:Test

      # 步骤7：生成静态文件
      - name: Generate Site
        run: |
          hexo clean
          hexo generate

      # 步骤8：部署到GitHub Pages
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: pages  # 你的发布分支
      - name: 调试信息
        run: |
          echo "事件类型: ${{ github.event_name }}"
          echo "触发者: ${{ github.actor }}"
          echo "仓库: ${{ github.repository }}"
          echo "分支: ${{ github.ref }}"
          echo "事件负载:"
          echo "${{ toJson(github.event) }}"
          echo "环境变量:"
          printenv