name: Supabase Keep Alive
on:
  schedule:
    - cron: '0 0 */6 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY"
            exit 1
          fi
      - name: Ping Supabase Database
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/Tag?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" || echo "ping failed, but keepalive continues"
