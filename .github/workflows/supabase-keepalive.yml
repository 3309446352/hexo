name: Supabase Keep Alive
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/Tag?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
